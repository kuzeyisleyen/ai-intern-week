services:
  ollama:
    image: ollama/ollama@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad  
    volumes:
      # İndirilen modelleri kalıcı olarak saklar.
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    # Yeniden üretilebilirlik için sürüm sabitlenmiştir.
    image: qdrant/qdrant:v1.19.0
    volumes:
      # Collection, point, payload ve index verilerini kalıcı tutar.
      - qdrant_data:/qdrant/storage

    # Dashboard'a host üzerinden erişmek istersen açabilirsin.
    # Yalnızca localhost'a bağlandığı için dış ağa açılmaz.
    # ports:
    #   - "127.0.0.1:6333:6333"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Compose içindeki Ollama servis adresi.
      OLLAMA_BASE_URL: http://ollama:11434

      # Yanıt üretiminde kullanılacak model.
      OLLAMA_MODEL: qwen3:1.7b

      # Doküman ve sorgu embedding'lerini üretecek model.
      OLLAMA_EMBED_MODEL: embeddinggemma

      # Compose içindeki Qdrant servis adresi.
      QDRANT_URL: http://qdrant:6333
      
      #Yeni mimari için ayrılmış model rolleri
      GENERATION_MODEL: qwen3:1.7b
      ROUTER_MODEL: qwen3:1.7b
      EMBEDDING_MODEL: embeddinggemma
      SPARSE_MODEL: Qdrant/bm25

    volumes:
      # Deney çıktılarını host üzerinde saklar.
      - ./output:/app/output

    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  # Ollama model dosyaları.
  ollama_data:

  # Qdrant veritabanı dosyaları.
  qdrant_data: